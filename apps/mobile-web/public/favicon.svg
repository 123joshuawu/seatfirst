<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle Tile (Charcoal #1c1a17 with subtle dark-tab separation rim) -->
  <rect width="512" height="512" rx="128" fill="#1c1a17" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />

  <!-- 4 Seats Together (The Sweet Spot Group Block) -->
  <!-- Top-Left Seat -->
  <rect x="80" y="80" width="160" height="160" rx="44" fill="#c8752c" />

  <!-- Top-Right Seat -->
  <rect x="272" y="80" width="160" height="160" rx="44" fill="#c8752c" />

  <!-- Bottom-Left Seat -->
  <rect x="80" y="272" width="160" height="160" rx="44" fill="#c8752c" />

  <!-- Bottom-Right Seat -->
  <rect x="272" y="272" width="160" height="160" rx="44" fill="#c8752c" />
</svg>
